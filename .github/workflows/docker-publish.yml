# Tests the system, then builds its image and publishes it to the GitHub Container Registry as ghcr.io/<owner>/address-book,
# for deployments such as a TrueNAS custom app. The image is only published if the tests pass.
#
# Image tags:
#   latest              the newest version: every push to main, and every version tag
#   1.2.3, 1.2 and 1    from a version tag, such as v1.2.3 - use one of these to stay on a version until you choose to update
#   sha-abc1234         every build, by commit
#
# Pull requests run the tests and build the image to check that it works, but don't publish it.
name: Test and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json

      - name: Install the test tools
        run: |
          pip install -r tests/requirements.txt
          cd tests/ui
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the tests
        env:
          # Also test copying data from MySQL with tools/mysql-to-sqlite.php
          MYSQL_IMAGE: mysql:9
        run: tests/run.sh

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/address-book
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          # TrueNAS SCALE runs on x86-64 only
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
