# Builds the production images and publishes them to the GitHub Container Registry (ghcr.io), for deployments such as a TrueNAS custom app.
#   ghcr.io/<owner>/address-book     - the system (Apache and PHP)
#   ghcr.io/<owner>/address-book-db  - MySQL with the database set-up built in
# Pushes to main are tagged "latest", and version tags (v1.2.3) are tagged "1.2.3" and "1.2".
# Pull requests build the images to check that they work, but don't publish them.
name: Docker images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: address-book
            dockerfile: Dockerfile
          - image: address-book-db
            dockerfile: docker/db.Dockerfile
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # TrueNAS SCALE runs on x86-64 only
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
