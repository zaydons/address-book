# Builds the image of the system and publishes it to the GitHub Container Registry as ghcr.io/<owner>/address-book,
# for deployments such as a TrueNAS custom app.
# Pushes to main are tagged "latest", and version tags (v1.2.3) are tagged "1.2.3" and "1.2".
# Pull requests build the image to check that it works, but don't publish it.
name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/address-book
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          # TrueNAS SCALE runs on x86-64 only
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
