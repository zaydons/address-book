# Address Book - TrueNAS SCALE custom app
#
# 1. Create a dataset for the app's data, such as SSDs/Applications/address-book (Datasets > Add Dataset).
#    It can be empty - the app sets its permissions when it starts.
# 2. In TrueNAS: Apps > Discover Apps > Custom App (the three dots menu) > Install via YAML, name the app,
#    and paste this file after changing:
#      - the dataset path in "volumes" to the one you created
#      - SITE_URL to the address you will use to reach the system
#      - TIMEZONE, such as America/New_York (see https://www.php.net/manual/en/timezones.php)
# 3. Open the SITE_URL address and log in as admin / LetMeIn123. You will be asked to choose a new password.
#
# The database (address-book.sqlite) and logged-in sessions are kept in the dataset, so they survive app updates
# and restarts, and are included in snapshots of the dataset. See the README for backups and other settings.

services:
  address-book:
    container_name: address-book
    environment:
      SITE_URL: "http://truenas.local:8080/"
      TIMEZONE: "America/New_York"
    # "latest" is the newest version. To stay on a version until you choose to update, use a version tag instead,
    # such as ghcr.io/zaydons/address-book:1 (the newest 1.x.x) or :1.2.0 (exactly that version)
    image: ghcr.io/zaydons/address-book:latest
    ports:
      # TrueNAS uses ports 80 and 443 for its own web interface. Change the first number to use a different port,
      # and change SITE_URL to match. The second number must stay 80
      - "8080:80"
    restart: unless-stopped
    volumes:
      - /mnt/SSDs/Applications/address-book:/data
