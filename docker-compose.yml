# Development environment: builds the same image as production, with the code mounted from this directory so that
# changes are seen straight away. The SQLite database is kept in the address-book-data volume.
services:
    app:
        build: .
        ports:
            - 80:80
        volumes:
            - ./html:/var/www/address-book/html
            - ./includes:/var/www/address-book/includes
            - ./sql:/var/www/address-book/sql
            - ./tools:/var/www/address-book/tools
            - address-book-data:/data
        environment:
            - SITE_URL=http://localhost/
            - TIMEZONE=UTC

volumes:
    address-book-data:
